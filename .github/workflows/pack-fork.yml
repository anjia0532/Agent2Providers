name: pack-fork
on:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - uses: dtolnay/rust-toolchain@stable
      - name: toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm cmake
      - name: build and pack
        run: node scripts/pack.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-linux
          path: dist/*.zip
          if-no-files-found: error
