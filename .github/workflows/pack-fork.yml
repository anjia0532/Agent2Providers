name: pack-fork
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - uses: dtolnay/rust-toolchain@stable
      - name: toolchain (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm cmake
      - name: toolchain (windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress
      - name: build and pack
        run: node scripts/pack.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error
