name: pack-fork
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - uses: dtolnay/rust-toolchain@stable
      - name: install nasm
        run: choco install nasm -y --no-progress
      - name: build and pack
        run: node scripts/pack.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: dist/*.zip
          if-no-files-found: error
